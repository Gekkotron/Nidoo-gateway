<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Nidoo-gateway architecture</title>
  <desc id="desc">The client sends an AES-GCM encrypted request to Nidoo-gateway. The gateway decrypts it and forwards it in plain form to an HTTP API or the MQTT broker. The reply comes back to the gateway, which encrypts it before returning it to the client.</desc>
  <style>
    :root {
      --card: #ffffff; --edge: #d0d7de; --box: #f6f8fa; --ink: #1f2328; --muted: #656d76;
      --enc: #bf8700; --enc-fill: #fff8c5; --plain: #1a7f37; --plain-fill: #dafbe1; --glow: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #0d1117; --edge: #30363d; --box: #161b22; --ink: #e6edf3; --muted: #8d96a0;
        --enc: #d29922; --enc-fill: #3b2e00; --plain: #3fb950; --plain-fill: #0f2e18; --glow: #4493f8;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .card { fill: var(--card); stroke: var(--edge); }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .name { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .lane { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-anchor: middle; text-transform: uppercase; }
    .lane.enc { fill: var(--enc); }
    .lane.plain { fill: var(--plain); }
    .wire { stroke-width: 2; fill: none; }
    .wire.enc { stroke: var(--enc); }
    .wire.plain { stroke: var(--plain); }
    .head.enc { fill: var(--enc); }
    .head.plain { fill: var(--plain); }
    .glow { fill: none; stroke: var(--glow); stroke-width: 3; opacity: 0; }

    .pkt rect { stroke-width: 1.5; }
    .pkt.enc rect { fill: var(--enc-fill); stroke: var(--enc); }
    .pkt.plain rect { fill: var(--plain-fill); stroke: var(--plain); }
    .lock { fill: none; stroke: var(--enc); stroke-width: 1.5; }
    .lock-body { fill: var(--enc); }
    .pkt text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; text-anchor: middle; }
    .pkt.enc text { fill: var(--enc); }
    .pkt.plain text { fill: var(--plain); font-size: 12px; font-weight: 600; }
    .step { font-size: 11px; fill: var(--glow); text-anchor: middle; font-weight: 600; opacity: 0; }

    /* Static positions: what you see with reduced motion. */
    .p1 { transform: translate(272px, 100px); }
    .p2 { transform: translate(607px, 100px); }
    .p3 { transform: translate(430px, 196px); }
    .p4 { transform: translate(607px, 130px); }
    .p5 { transform: translate(450px, 222px); }
    .p6 { transform: translate(272px, 130px); }

    @media (prefers-reduced-motion: no-preference) {
      .pkt, .glow, .step { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
      .p4 { animation-name: p4; } .p5 { animation-name: p5; } .p6 { animation-name: p6; }
      .g-gw-in { animation-name: g-gw-in; } .g-gw-out { animation-name: g-gw-out; }
      .g-ends { animation-name: g-ends; } .g-client { animation-name: g-client; }
      .s-dec { animation-name: s-dec; } .s-enc { animation-name: s-enc; }
    }

    /* Request: encrypted client -> gateway, then plain out to HTTP and MQTT. */
    @keyframes p1 {
      0%   { transform: translate(222px, 100px); opacity: 0; }
      3%   { opacity: 1; }
      24%  { transform: translate(322px, 100px); opacity: 1; }
      26%, 100% { transform: translate(322px, 100px); opacity: 0; }
    }
    @keyframes p2 {
      0%, 32% { transform: translate(557px, 100px); opacity: 0; }
      34%  { opacity: 1; }
      50%  { transform: translate(657px, 100px); opacity: 1; }
      52%, 100% { transform: translate(657px, 100px); opacity: 0; }
    }
    @keyframes p3 {
      0%, 32% { transform: translate(430px, 186px); opacity: 0; }
      34%  { opacity: 1; }
      50%  { transform: translate(430px, 228px); opacity: 1; }
      52%, 100% { transform: translate(430px, 228px); opacity: 0; }
    }
    /* Reply: plain back into the gateway, then encrypted to the client. */
    @keyframes p4 {
      0%, 56% { transform: translate(657px, 130px); opacity: 0; }
      58%  { opacity: 1; }
      70%  { transform: translate(557px, 130px); opacity: 1; }
      72%, 100% { transform: translate(557px, 130px); opacity: 0; }
    }
    @keyframes p5 {
      0%, 56% { transform: translate(450px, 228px); opacity: 0; }
      58%  { opacity: 1; }
      70%  { transform: translate(450px, 186px); opacity: 1; }
      72%, 100% { transform: translate(450px, 186px); opacity: 0; }
    }
    @keyframes p6 {
      0%, 76% { transform: translate(322px, 130px); opacity: 0; }
      78%  { opacity: 1; }
      94%  { transform: translate(222px, 130px); opacity: 1; }
      96%, 100% { transform: translate(222px, 130px); opacity: 0; }
    }
    @keyframes g-gw-in  { 0%, 24% { opacity: 0; } 27% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes g-gw-out { 0%, 70% { opacity: 0; } 73% { opacity: 1; } 79%, 100% { opacity: 0; } }
    @keyframes g-ends   { 0%, 49% { opacity: 0; } 52% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes g-client { 0%, 93% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s-dec { 0%, 24% { opacity: 0; } 26%, 33% { opacity: 1; } 36%, 100% { opacity: 0; } }
    @keyframes s-enc { 0%, 70% { opacity: 0; } 72%, 79% { opacity: 1; } 82%, 100% { opacity: 0; } }
  </style>

  <defs>
    <path id="arrow" d="M0 0 L-9 -5 L-9 5 Z" />
    <g id="lock">
      <path class="lock" d="M-3 -1 v-3 a3 3 0 0 1 6 0 v3" />
      <rect class="lock-body" x="-4.5" y="-1" width="9" height="7" rx="1.5" />
    </g>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="879" height="349" rx="14" />

  <!-- Wires: client <-> gateway (encrypted) -->
  <line class="wire enc" x1="204" y1="100" x2="334" y2="100" />
  <use href="#arrow" class="head enc" transform="translate(343 100)" />
  <line class="wire enc" x1="345" y1="130" x2="214" y2="130" />
  <use href="#arrow" class="head enc" transform="translate(205 130) rotate(180)" />
  <text class="lane enc" x="272" y="84">Encrypted</text>
  <text class="lane enc" x="272" y="156">AES-GCM</text>

  <!-- Wires: gateway <-> HTTP (plain) -->
  <line class="wire plain" x1="539" y1="100" x2="669" y2="100" />
  <use href="#arrow" class="head plain" transform="translate(678 100)" />
  <line class="wire plain" x1="680" y1="130" x2="549" y2="130" />
  <use href="#arrow" class="head plain" transform="translate(540 130) rotate(180)" />
  <text class="lane plain" x="607" y="84">Plain</text>
  <text class="lane plain" x="607" y="156">HTTP</text>

  <!-- Wires: gateway <-> MQTT (plain) -->
  <line class="wire plain" x1="430" y1="174" x2="430" y2="236" />
  <use href="#arrow" class="head plain" transform="translate(430 245) rotate(90)" />
  <line class="wire plain" x1="450" y1="245" x2="450" y2="183" />
  <use href="#arrow" class="head plain" transform="translate(450 174) rotate(-90)" />
  <text class="lane plain" x="500" y="204">Plain</text>
  <text class="lane plain" x="500" y="219">MQTT</text>

  <!-- Boxes -->
  <rect class="box" x="30" y="70" width="170" height="90" rx="10" />
  <rect class="glow g-client" x="27" y="67" width="176" height="96" rx="12" />
  <text class="name" x="115" y="111">Client</text>
  <text class="sub" x="115" y="131">your app</text>

  <rect class="box" x="345" y="60" width="190" height="110" rx="12" />
  <rect class="glow g-gw-in" x="342" y="57" width="196" height="116" rx="14" />
  <rect class="glow g-gw-out" x="342" y="57" width="196" height="116" rx="14" />
  <use href="#lock" transform="translate(440 86) scale(1.4)" />
  <text class="name" x="440" y="118">Nidoo-gateway</text>
  <text class="sub" x="440" y="138">decrypt · forward · encrypt</text>
  <text class="step s-dec" x="440" y="158">decrypting</text>
  <text class="step s-enc" x="440" y="158">encrypting</text>

  <rect class="box" x="680" y="70" width="170" height="90" rx="10" />
  <rect class="glow g-ends" x="677" y="67" width="176" height="96" rx="12" />
  <text class="name" x="765" y="111">HTTP APIs</text>
  <text class="sub" x="765" y="131">any server</text>

  <rect class="box" x="355" y="245" width="170" height="70" rx="10" />
  <rect class="glow g-ends" x="352" y="242" width="176" height="76" rx="12" />
  <text class="name" x="440" y="276">MQTT broker</text>
  <text class="sub" x="440" y="296">publish · subscribe</text>

  <!-- Packets -->
  <g class="pkt enc p1">
    <rect x="-22" y="-10" width="44" height="20" rx="5" />
    <use href="#lock" transform="translate(-12 0) scale(.8)" />
    <text x="6" y="3.5">a9f3</text>
  </g>
  <g class="pkt plain p2"><rect x="-17" y="-10" width="34" height="20" rx="5" /><text y="4">{…}</text></g>
  <g class="pkt plain p3"><rect x="-17" y="-10" width="34" height="20" rx="5" /><text y="4">{…}</text></g>
  <g class="pkt plain p4"><rect x="-17" y="-10" width="34" height="20" rx="5" /><text y="4">{…}</text></g>
  <g class="pkt plain p5"><rect x="-17" y="-10" width="34" height="20" rx="5" /><text y="4">{…}</text></g>
  <g class="pkt enc p6">
    <rect x="-22" y="-10" width="44" height="20" rx="5" />
    <use href="#lock" transform="translate(-12 0) scale(.8)" />
    <text x="6" y="3.5">7c2e</text>
  </g>
</svg>
